<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audrey Tong-Nomoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ✿ EDIT YOUR LINKS IN THE CONFIG BLOCK INSIDE <script> BELOW ✿
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d3a45; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: grab;
  }
  body.dragging { cursor: grabbing; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hero {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; color: #f4fbf8; pointer-events: none; width: min(90vw, 640px);
    text-shadow: 0 2px 18px rgba(5, 40, 50, .55), 0 1px 2px rgba(5, 40, 50, .4);
  }
  .hero .hi { font-weight: 800; letter-spacing: .25em; font-size: 12px; text-transform: uppercase; opacity: .8; }
  .hero h1 {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 500;
    font-size: clamp(38px, 7.5vw, 84px); line-height: 1; margin: 10px 0 14px;
  }
  .hero p { font-size: clamp(14px, 1.8vw, 18px); font-weight: 600; opacity: .92; line-height: 1.5; }

  .pad {
    position: fixed; left: var(--x); top: var(--y);
    width: var(--s); height: var(--s);
    transform: translate(-50%, -50%) rotate(var(--r));
    text-decoration: none; display: grid; place-items: center;
    animation: bob var(--d, 6s) ease-in-out infinite;
    filter: drop-shadow(6px 10px 8px rgba(0, 25, 30, .35));
    transition: filter .3s;
  }
  .pad svg { position: absolute; inset: 0; width: 100%; height: 100%; transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  .pad.deco { pointer-events: none; }
  a.pad { cursor: pointer; }
  a.pad:hover svg, a.pad:focus-visible svg { transform: scale(1.1) rotate(-8deg); }
  a.pad:hover .lbl, a.pad:focus-visible .lbl { transform: rotate(calc(-1 * var(--r))) translateY(-4px) scale(1.06); background: #fffaf2; }
  .lbl {
    position: relative; z-index: 1;
    transform: rotate(calc(-1 * var(--r)));
    background: rgba(255, 250, 242, .92); color: #2b5a3e;
    font-weight: 800; font-size: clamp(12px, 1.4vw, 15px);
    padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 3px 0 rgba(30, 80, 50, .25);
    transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), background .2s;
    white-space: nowrap;
  }
  .lbl .e { margin-right: 4px; }
  @keyframes bob {
    0%, 100% { translate: 0 0; rotate: 0deg; }
    50% { translate: 3px -5px; rotate: 4deg; }
  }

  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: rgba(240, 252, 248, .75); font-size: 13px; font-weight: 700; letter-spacing: .04em;
    pointer-events: none; transition: opacity 1.2s; white-space: nowrap;
    text-shadow: 0 1px 6px rgba(0, 30, 40, .5);
  }
  .hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="pond"></canvas>

<div class="hero">
  <div class="hi">hi, i'm</div>
  <h1 id="name"></h1>
  <p id="tagline"></p>
</div>

<div id="pads"></div>
<div class="hint" id="hint">drag to make ripples · tap the water to feed the koi</div>

<script>
/* ===================== ✿ CONFIG — edit me ✿ ===================== */
const CONFIG = {
  name: "Audrey Tong-Nomoto",
  tagline: "cognitive science + computer science @ penn<br>product-minded builder · ai · tech · always has music on",
  links: [
    { label: "github",   emoji: "🐙", href: "https://github.com/audreytongnomoto" },
    { label: "linkedin", emoji: "💼", href: "https://www.linkedin.com/in/audreytongnomoto/" },
    { label: "email",    emoji: "💌", href: "mailto:tnomoto@sas.upenn.edu" },
    // { label: "résumé", emoji: "📄", href: "PASTE-RESUME-LINK" },   // ← uncomment when ready
  ],
};
/* ================================================================ */

document.getElementById('name').textContent = CONFIG.name;
document.getElementById('tagline').innerHTML = CONFIG.tagline;

/* ---------- lily pads ---------- */
const padSVG = (lotus) => `
<svg viewBox="0 0 100 100" aria-hidden="true">
  <defs>
    <radialGradient id="g${Math.random().toString(36).slice(2,7)}" cx="45%" cy="45%" r="60%">
      <stop offset="0" stop-color="#8fd18a"/><stop offset=".7" stop-color="#5aa865"/><stop offset="1" stop-color="#3d8650"/>
    </radialGradient>
  </defs>
  <path d="M50 50 L96.4 62.4 A48 48 0 1 1 96.4 37.6 Z" fill="url(#GID)" stroke="#2f6f42" stroke-width="1.5"/>
  <g stroke="rgba(235,255,225,.28)" stroke-width="1.2" fill="none" stroke-linecap="round">
    ${[30, 75, 120, 165, 210, 255, 300, 330].map(a => {
      const r = a * Math.PI / 180;
      return `<path d="M50 50 Q${50 + 22 * Math.cos(r + .15)} ${50 + 22 * Math.sin(r + .15)} ${50 + 44 * Math.cos(r)} ${50 + 44 * Math.sin(r)}"/>`;
    }).join('')}
  </g>
  ${lotus ? `<g transform="translate(46 46)">
    ${[0, 60, 120, 180, 240, 300].map(a => `<ellipse rx="7" ry="15" cy="-11" fill="#f7b8c8" stroke="#e48aa4" stroke-width=".8" transform="rotate(${a})"/>`).join('')}
    ${[30, 90, 150, 210, 270, 330].map(a => `<ellipse rx="5.5" ry="11" cy="-8" fill="#fde0e8" stroke="#ef9fb6" stroke-width=".6" transform="rotate(${a})"/>`).join('')}
    <circle r="5" fill="#ffd66b"/>
  </g>` : ''}
</svg>`.replace(/url\(#GID\)/, (m, o, s) => `url(#${s.match(/id="(g\w+)"/)[1]})`);

const padsEl = document.getElementById('pads');
const linkSpots = [
  { x: '19%', y: '22%', r: -14 }, { x: '80%', y: '25%', r: 22 },
  { x: '23%', y: '76%', r: 35 },  { x: '77%', y: '78%', r: -28 },
];
const decoSpots = [
  { x: '6%', y: '50%', s: 'clamp(60px,8vw,100px)', r: 70, lotus: false },
  { x: '93%', y: '54%', s: 'clamp(80px,10vw,130px)', r: 140, lotus: true },
  { x: '52%', y: '93%', s: 'clamp(50px,6vw,80px)', r: 200, lotus: false },
  { x: '56%', y: '7%', s: 'clamp(55px,7vw,90px)', r: 260, lotus: true },
  { x: '37%', y: '95%', s: 'clamp(40px,4.5vw,60px)', r: 10, lotus: false },
];
if (CONFIG.links.length < 4) decoSpots.push({ x: '77%', y: '78%', s: 'clamp(90px,11vw,135px)', r: -28, lotus: true });
decoSpots.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'pad deco';
  el.style.cssText = `--x:${d.x};--y:${d.y};--s:${d.s};--r:${d.r}deg;--d:${7 + i}s;animation-delay:-${i * 1.3}s`;
  el.innerHTML = padSVG(d.lotus);
  padsEl.appendChild(el);
});
CONFIG.links.forEach((l, i) => {
  const p = linkSpots[i % linkSpots.length];
  const a = document.createElement('a');
  a.className = 'pad';
  a.href = l.href;
  if (!l.href.startsWith('mailto:') && l.href !== '#') { a.target = '_blank'; a.rel = 'noopener'; }
  a.style.cssText = `--x:${p.x};--y:${p.y};--s:clamp(96px,13vw,150px);--r:${p.r}deg;--d:${5.5 + i * .7}s;animation-delay:-${i}s`;
  a.innerHTML = padSVG(false) + `<span class="lbl"><span class="e">${l.emoji}</span>${l.label}</span>`;
  a.addEventListener('pointerenter', () => {
    const b = a.getBoundingClientRect();
    splash(b.left + b.width / 2, b.top + b.height / 2, 6, 160);
  });
  padsEl.appendChild(a);
});

/* ---------- pond setup ---------- */
const cv = document.getElementById('pond');
const ctx = cv.getContext('2d');
const bg = document.createElement('canvas'), bctx = bg.getContext('2d');
const rc = document.createElement('canvas'), rctx = rc.getContext('2d');
let W, H, dpr, S, gw, gh, cur, prev, img, buf32;

function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  bg.width = W * dpr; bg.height = H * dpr;
  S = W < 700 ? 3 : 4;
  gw = Math.ceil(W / S) + 2; gh = Math.ceil(H / S) + 2;
  cur = new Float32Array(gw * gh); prev = new Float32Array(gw * gh);
  rc.width = gw; rc.height = gh;
  img = rctx.createImageData(gw, gh); buf32 = new Uint32Array(img.data.buffer);
  drawBg();
}

function drawBg() {
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = bctx.createRadialGradient(W * .5, H * .45, 0, W * .5, H * .5, Math.max(W, H) * .75);
  g.addColorStop(0, '#3f9a98'); g.addColorStop(.55, '#22707a'); g.addColorStop(1, '#0e3c48');
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  // pebbles on the pond floor
  const n = Math.floor(W * H / 2500);
  for (let i = 0; i < n; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 3 + Math.random() * 12;
    bctx.fillStyle = `hsla(${150 + Math.random() * 60},${20 + Math.random() * 20}%,${15 + Math.random() * 30}%,${.08 + Math.random() * .12})`;
    bctx.beginPath(); bctx.ellipse(x, y, r, r * (.6 + Math.random() * .4), Math.random() * 3, 0, 7); bctx.fill();
  }
  // soft light patches
  for (let i = 0; i < 9; i++) {
    const x = Math.random() * W, y = Math.random() * H, r = 120 + Math.random() * 220;
    const lg = bctx.createRadialGradient(x, y, 0, x, y, r);
    lg.addColorStop(0, 'rgba(180,255,230,.07)'); lg.addColorStop(1, 'rgba(180,255,230,0)');
    bctx.fillStyle = lg; bctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

/* ---------- ripples ---------- */
function splash(x, y, r, amp) {
  const cx = Math.round(x / S), cy = Math.round(y / S);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const d = Math.hypot(dx, dy); if (d >= r) continue;
    const gx = cx + dx, gy = cy + dy;
    if (gx < 1 || gy < 1 || gx >= gw - 1 || gy >= gh - 1) continue;
    cur[gy * gw + gx] += amp * (.5 + .5 * Math.cos(Math.PI * d / r));
  }
}
function stepRipple() {
  for (let y = 1; y < gh - 1; y++) {
    let i = y * gw + 1;
    for (let x = 1; x < gw - 1; x++, i++) {
      let v = (cur[i - 1] + cur[i + 1] + cur[i - gw] + cur[i + gw]) * .5 - prev[i];
      prev[i] = v - v / 42;
    }
  }
  const t = cur; cur = prev; prev = t;
}
function renderRipple() {
  const K = 1.1;
  for (let y = 1; y < gh - 1; y++) {
    let i = y * gw + 1;
    for (let x = 1; x < gw - 1; x++, i++) {
      const s = (cur[i - 1] - cur[i + 1]) + (cur[i - gw] - cur[i + gw]);
      if (s > 0) { const a = Math.min(170, s * K) | 0; buf32[i] = (a << 24) | 0xfff8ee; }
      else { const a = Math.min(130, -s * K) | 0; buf32[i] = (a << 24) | (48 << 16) | (38 << 8) | 6; }
    }
  }
  rctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(rc, 0, 0, gw * S, gh * S);
}

/* ---------- koi ---------- */
const PATTERNS = [
  { base: '#f4eee6', spots: ['#d9472a', '#d9472a', '#e05a2e'] },            // kohaku
  { base: '#f4eee6', spots: ['#d9472a', '#d9472a', '#1d1d22'] },            // sanke
  { base: '#f59a2c', spots: ['#ffc463', '#ffb347'] },                       // orange
  { base: '#f2c757', spots: ['#fff3c9', '#ffe08a'] },                       // gold
  { base: '#24242a', spots: ['#d9472a', '#f4eee6', '#d9472a'] },            // showa
  { base: '#f4eee6', spots: [], tancho: true },                             // tancho
  { base: '#a9bfd0', spots: ['#ee7a3c', '#f39a54'] },                       // asagi-ish
];
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16), rgb = `${n >> 16},${(n >> 8) & 255},${n & 255}`; return a === null ? rgb : `rgba(${rgb},${a})`; };
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const widthAt = t => Math.pow(Math.max(0, Math.sin(Math.PI * Math.min(1, t * .92 + .1))), .75);

class Koi {
  constructor(i) {
    const p = PATTERNS[i % PATTERNS.length];
    this.base = p.base;
    this.size = rand(4.6, 6.4) * (W < 700 ? .75 : 1);
    this.n = 16; this.segLen = this.size * 1.05; this.maxW = this.size * 2;
    this.angle = rand(0, 6.28); this.turnV = 0; this.v = rand(.8, 1.3); this.phase = rand(0, 6);
    this.baseSpeed = rand(.9, 1.4);
    const x = rand(W * .15, W * .85), y = rand(H * .15, H * .85);
    this.segs = Array.from({ length: this.n }, (_, k) => ({ x: x - Math.cos(this.angle) * k * this.segLen, y: y - Math.sin(this.angle) * k * this.segLen }));
    this.spots = [];
    if (p.tancho) this.spots.push({ t: .1, off: 0, r: .85, c: '#e23d2a' });
    const k = p.spots.length ? 3 + (Math.random() * 3 | 0) : 0;
    for (let j = 0; j < k; j++) this.spots.push({ t: rand(.08, .75), off: rand(-.8, .8), r: rand(.6, 1.3), c: p.spots[j % p.spots.length] });
    this.finRGB = p.base === '#24242a' ? '70,70,82' : hexA(p.base, null);
  }
  update(dt) {
    const h = this.segs[0];
    let target = null, mul = 1;
    // food
    let best = null, bd = 280;
    for (const f of food) { const d = Math.hypot(f.x - h.x, f.y - h.y); if (d < bd) { bd = d; best = f; } }
    if (best) {
      target = Math.atan2(best.y - h.y, best.x - h.x); mul = 1.9;
      if (bd < this.size * 2.2) { best.eaten = true; splash(best.x, best.y, 3, 90); }
    }
    // flee the finger
    if (pointer.down) {
      const d = Math.hypot(h.x - pointer.x, h.y - pointer.y);
      if (d < 150) { target = Math.atan2(h.y - pointer.y, h.x - pointer.x); mul = 2.8; }
    }
    // stay in the pond
    const m = 70;
    if (h.x < m || h.x > W - m || h.y < m || h.y > H - m) target = Math.atan2(H / 2 - h.y + rand(-80, 80), W / 2 - h.x + rand(-80, 80));

    if (target !== null) {
      const d = angDiff(target, this.angle);
      this.angle += Math.max(-.07, Math.min(.07, d)) * dt;
      this.turnV *= .9;
    } else {
      this.turnV += rand(-.004, .004) * dt; this.turnV *= .97;
      this.angle += this.turnV * dt;
    }
    this.v += (this.baseSpeed * mul - this.v) * .05 * dt;
    this.phase += this.v * .16 * dt;
    const wig = Math.sin(this.phase) * .035;
    h.x += Math.cos(this.angle + wig) * this.v * dt;
    h.y += Math.sin(this.angle + wig) * this.v * dt;
    for (let i = 1; i < this.n; i++) {
      const a = this.segs[i - 1], b = this.segs[i];
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      b.x = a.x + Math.cos(ang) * this.segLen; b.y = a.y + Math.sin(ang) * this.segLen;
    }
  }
  segAngle(i) {
    const a = i === 0 ? this.segs[0] : this.segs[i - 1], b = i === 0 ? this.segs[1] : this.segs[i];
    return Math.atan2(a.y - b.y, a.x - b.x);
  }
  bodyPath(ox = 0, oy = 0) {
    const L = [], R = [];
    for (let i = 0; i < this.n; i++) {
      const p = this.segs[i], a = this.segAngle(i), w = widthAt(i / (this.n - 1)) * this.maxW;
      const nx = -Math.sin(a) * w, ny = Math.cos(a) * w;
      L.push([p.x + nx + ox, p.y + ny + oy]); R.push([p.x - nx + ox, p.y - ny + oy]);
    }
    const pts = L.concat(R.reverse());
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const h = this.segs[0], a0 = this.segAngle(0), last = pts[pts.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.quadraticCurveTo(h.x + Math.cos(a0) * this.maxW * 1.5 + ox, h.y + Math.sin(a0) * this.maxW * 1.5 + oy, pts[0][0], pts[0][1]);
    ctx.closePath();
  }
  pointAt(t, off) {
    const f = t * (this.n - 1), i = Math.min(this.n - 2, f | 0), u = f - i;
    const a = this.segs[i], b = this.segs[i + 1], ang = this.segAngle(i + 1);
    const w = widthAt(t) * this.maxW * off;
    return [a.x + (b.x - a.x) * u - Math.sin(ang) * w, a.y + (b.y - a.y) * u + Math.cos(ang) * w];
  }
  drawFins() {
    const s = this.size, c = this.finRGB;
    // tail
    const p = this.segs[this.n - 1], q = this.segs[this.n - 2];
    const dir = Math.atan2(p.y - q.y, p.x - q.x), sway = Math.sin(this.phase - 1.4) * .35;
    const Lt = s * 3.8, sp = .58;
    const P = (ang, len) => [p.x + Math.cos(ang) * len, p.y + Math.sin(ang) * len];
    const t1 = P(dir + sp + sway, Lt), t2 = P(dir - sp + sway, Lt), nt = P(dir + sway, Lt * .55);
    const c1 = P(dir + sp * .4 + sway * .5, Lt * .55), c2 = P(dir - sp * .4 + sway * .5, Lt * .55);
    const tg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Lt);
    tg.addColorStop(0, `rgba(${c},.8)`); tg.addColorStop(.6, `rgba(${c},.38)`); tg.addColorStop(1, `rgba(${c},.12)`);
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(c1[0], c1[1], t1[0], t1[1]);
    ctx.quadraticCurveTo(nt[0], nt[1], t2[0], t2[1]);
    ctx.quadraticCurveTo(c2[0], c2[1], p.x, p.y); ctx.fill();
    // fin rays
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = .7;
    ctx.beginPath();
    for (let k = -1; k <= 1.001; k += .25) {
      const e = P(dir + sway + k * sp * .92, Lt * (.62 + .36 * Math.abs(k)));
      ctx.moveTo(p.x, p.y); ctx.lineTo(e[0], e[1]);
    }
    ctx.stroke();
    // pectoral fins
    const fp = this.segs[3], fa = this.segAngle(3);
    for (const side of [1, -1]) {
      const w = widthAt(3 / (this.n - 1)) * this.maxW * .8;
      ctx.save();
      ctx.translate(fp.x - Math.sin(fa) * w * side, fp.y + Math.cos(fa) * w * side);
      ctx.rotate(fa + Math.PI - side * (.85 + Math.sin(this.phase * 1.3 + side) * .25));
      const fg = ctx.createLinearGradient(0, 0, s * 3.4, 0);
      fg.addColorStop(0, `rgba(${c},.75)`); fg.addColorStop(1, `rgba(${c},.12)`);
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s * 1.4, -s * 1.3, s * 3.3, -s * .2);
      ctx.quadraticCurveTo(s * 1.8, s * .9, 0, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = .6; ctx.beginPath();
      for (let k = 0; k < 5; k++) { ctx.moveTo(0, 0); ctx.lineTo(s * (2.4 + k * .2), -s * .8 + k * s * .3); }
      ctx.stroke();
      ctx.restore();
    }
  }
  drawShadow() {
    // soft blurred shadow cast on the pond floor
    ctx.save();
    ctx.shadowColor = 'rgba(0,22,28,.42)';
    ctx.shadowBlur = 9 * dpr; ctx.shadowOffsetX = (5000 + 10) * dpr; ctx.shadowOffsetY = 15 * dpr;
    ctx.fillStyle = '#000';
    this.bodyPath(-5000, 0); ctx.fill();
    ctx.restore();
  }
  spine(from, to, ox, oy) {
    ctx.beginPath(); ctx.moveTo(this.segs[from].x + ox, this.segs[from].y + oy);
    for (let i = from + 1; i <= to; i++) ctx.lineTo(this.segs[i].x + ox, this.segs[i].y + oy);
  }
  draw() {
    this.drawFins();
    this.bodyPath(); ctx.fillStyle = this.base; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // soft-edged pattern patches
    for (const sp of this.spots) {
      const [x, y] = this.pointAt(sp.t, sp.off), r = sp.r * this.maxW;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, sp.c); g.addColorStop(.72, sp.c); g.addColorStop(1, hexA(sp.c, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
    // rounded body: darken toward the edges
    this.bodyPath();
    ctx.strokeStyle = 'rgba(0,15,20,.035)';
    for (let k = 1.5; k > .15; k -= .12) { ctx.lineWidth = this.maxW * k; ctx.stroke(); }
    // glossy sheen along the back (light from upper-left)
    const lx = -this.size * .3, ly = -this.size * .38;
    ctx.strokeStyle = 'rgba(255,255,255,.045)';
    for (let k = 1.1; k > .1; k -= .1) { ctx.lineWidth = this.maxW * k; this.spine(0, 10, lx, ly); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = this.size * .28; this.spine(1, 5, lx * 1.3, ly * 1.3); ctx.stroke();
    // tiny scale glints
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    for (let i = 3; i < 11; i += 1) {
      for (const o of [-.45, .1, .55]) {
        const [x, y] = this.pointAt(i / (this.n - 1) + ((i * 7 + o * 10) % 3) * .006, o);
        ctx.beginPath(); ctx.arc(x, y, this.size * .13, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
    // eyes
    const a = this.segAngle(1), e = this.segs[1], ew = this.maxW * .55;
    for (const side of [1, -1]) {
      const x = e.x - Math.sin(a) * ew * side + Math.cos(a) * 2, y = e.y + Math.cos(a) * ew * side + Math.sin(a) * 2;
      ctx.fillStyle = '#121216'; ctx.beginPath(); ctx.arc(x, y, this.size * .3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - this.size * .1, y - this.size * .1, this.size * .1, 0, 7); ctx.fill();
    }
  }
}

/* ---------- food & petals ---------- */
const food = [];
function feed(x, y) {
  splash(x, y, 5, 260);
  for (let i = 0; i < 5; i++) food.push({ x: x + rand(-22, 22), y: y + rand(-22, 22), life: 900, eaten: false });
}
const petals = Array.from({ length: 9 }, () => ({ x: rand(0, innerWidth), y: rand(0, innerHeight), r: rand(0, 6), vr: rand(-.01, .01), vx: rand(-.15, .15), vy: rand(.05, .2), s: rand(.7, 1.2) }));

/* ---------- input ---------- */
const pointer = { x: -999, y: -999, down: false, sx: 0, sy: 0, moved: 0, lx: 0, ly: 0 };
let hintTimer = null;
function hideHint() { document.getElementById('hint').classList.add('gone'); }
setTimeout(hideHint, 9000);

addEventListener('pointerdown', e => {
  if (e.target.closest('a.pad')) return;
  pointer.down = true; pointer.moved = 0;
  pointer.sx = pointer.lx = pointer.x = e.clientX; pointer.sy = pointer.ly = pointer.y = e.clientY;
  document.body.classList.add('dragging');
  splash(e.clientX, e.clientY, 4, 120);
});
addEventListener('pointermove', e => {
  const x = e.clientX, y = e.clientY;
  if (pointer.down) {
    const d = Math.hypot(x - pointer.lx, y - pointer.ly);
    pointer.moved += d;
    const steps = Math.max(1, Math.ceil(d / (S * 2)));
    for (let k = 1; k <= steps; k++) splash(pointer.lx + (x - pointer.lx) * k / steps, pointer.ly + (y - pointer.ly) * k / steps, 3, 45);
    for (const p of petals) { const pd = Math.hypot(p.x - x, p.y - y); if (pd < 90) { p.vx += (x - pointer.lx) * .02; p.vy += (y - pointer.ly) * .02; } }
    if (pointer.moved > 60) hideHint();
  } else if (e.pointerType === 'mouse' && Math.random() < .35) {
    splash(x, y, 2, 14);
  }
  pointer.x = pointer.lx = x; pointer.y = pointer.ly = y;
});
const up = e => {
  if (!pointer.down) return;
  pointer.down = false; document.body.classList.remove('dragging');
  if (pointer.moved < 8) { feed(e.clientX, e.clientY); hideHint(); }
};
addEventListener('pointerup', up);
addEventListener('pointercancel', () => { pointer.down = false; document.body.classList.remove('dragging'); });

/* ---------- loop ---------- */
resize();
let koi = Array.from({ length: W < 700 ? 5 : 8 }, (_, i) => new Koi(i));
addEventListener('resize', () => { resize(); koi = Array.from({ length: W < 700 ? 5 : 8 }, (_, i) => new Koi(i)); });

let last = performance.now(), tick = 0;
function frame(now) {
  const dt = Math.min(3, (now - last) / 16.67); last = now; tick++;
  stepRipple();
  if (tick % 70 === 0) splash(rand(0, W), rand(0, H), 2, rand(30, 70)); // gentle drips

  for (const k of koi) k.update(dt);
  for (let i = food.length - 1; i >= 0; i--) { food[i].life -= dt; if (food[i].eaten || food[i].life <= 0) food.splice(i, 1); }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  for (const k of koi) k.drawShadow();
  for (const k of koi) k.draw();
  // water tint so the koi feel submerged
  ctx.fillStyle = 'rgba(25,95,105,.16)'; ctx.fillRect(0, 0, W, H);
  // food on the surface
  for (const f of food) {
    ctx.globalAlpha = Math.min(1, f.life / 120);
    ctx.fillStyle = '#b5713c'; ctx.beginPath(); ctx.arc(f.x, f.y, 3.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#e7b17a'; ctx.beginPath(); ctx.arc(f.x - 1, f.y - 1, 1.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  renderRipple();
  // drifting blossom petals
  for (const p of petals) {
    p.vx *= .985; p.vy = p.vy * .985 + .002; p.x += p.vx * dt + .1; p.y += p.vy * dt; p.r += p.vr * dt;
    if (p.x > W + 20) p.x = -20; if (p.x < -20) p.x = W + 20; if (p.y > H + 20) p.y = -20; if (p.y < -20) p.y = H + 20;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(p.s, p.s);
    ctx.fillStyle = 'rgba(0,30,35,.18)'; ctx.beginPath(); ctx.ellipse(3, 4, 7, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd3df'; ctx.beginPath();
    ctx.moveTo(-7, 0); ctx.quadraticCurveTo(-3, -6, 5, -3); ctx.lineTo(3, 0); ctx.lineTo(5, 3); ctx.quadraticCurveTo(-3, 6, -7, 0); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
